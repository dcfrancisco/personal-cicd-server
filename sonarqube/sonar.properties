# SonarQube Configuration File

# Database Configuration
# sonar.jdbc.url=jdbc:postgresql://postgres:5432/sonarqube
# sonar.jdbc.username=sonarqube
# sonar.jdbc.password=sonarqube_password
# sonar.jdbc.driverClassName=org.postgresql.Driver

# SonarQube Server Configuration
sonar.core.serverBaseURL=http://localhost:9000
sonar.web.host=0.0.0.0
sonar.web.port=9000
sonar.web.context=

# Elasticsearch
sonar.search.javaOpts=-Xms512m -Xmx512m -XX:+HeapDumpOnOutOfMemoryError

# Enable Admin features
sonar.login.allow_identity_provider_forking=true

# Security
sonar.security.realm=LDAP
sonar.security.updateUserAttributes=true
sonar.authenticator.downcase=true
