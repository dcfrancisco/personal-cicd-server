version: "3.9"
services:
  jenkins:
    build:
      context: ./jenkins
    container_name: jenkins-instance
    ports:
      - "8080:8080"
    environment:
      - JENKINS_OPTS=--httpPort=8080 -Dorg.apache.commons.jelly.tags.fmt.timeZone=UTC
      - JAVA_OPTS=-Xmx1024m -Xms512m
    volumes:
      - ./volume/jenkins:/var/jenkins_home
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always

  nexus:
    build:
      context: ./nexus
    container_name: nexus-instance
    expose:
      - 8081
      - 8082
      - 8083
    ports:
      - "8082:8082"
      - "8083:8083"
      - "8081:8081"
    volumes:
      - ./volume:/nexus-data
    restart: always

  sonarqube:
    build:
      context: ./sonarqube
    container_name: sonarqube-instance
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonarqube
      - SONAR_JDBC_PASSWORD=sonarqube_password
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLED=true
      - JAVA_OPTS=-Xmx1024m -Xms512m
    ports:
      - "9000:9000"
    volumes:
      - ./volume/sonarqube/data:/opt/sonarqube/data
      - ./volume/sonarqube/logs:/opt/sonarqube/logs
      - ./volume/sonarqube/extensions:/opt/sonarqube/extensions
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: postgres-instance
    environment:
      - POSTGRES_USER=sonarqube
      - POSTGRES_PASSWORD=sonarqube_password
      - POSTGRES_DB=sonarqube
    volumes:
      - ./volume/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  gitlab:
    image: gitlab/gitlab-ee:latest
    container_name: gitlab-instance
    hostname: gitlab.local
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['initial_root_password'] = 'gitlabadmin123'
        gitlab_rails['initial_shared_runners_registration_token'] = 'glrt-1234567890'
    ports:
      - "80:80"
      - "2222:22"
    volumes:
      - ./volume/gitlab/config:/etc/gitlab
      - ./volume/gitlab/data:/var/opt/gitlab
      - ./volume/gitlab/logs:/var/log/gitlab
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/-/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: always

volumes: {}
